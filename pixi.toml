[workspace]
name = "FreeCAD"
version = "26.3.0"
description = "pixi instructions for FreeCAD_BT (Apple Silicon only; full FreeCAD modules)"
authors = ["looooo <sppedflyer@gmail.com>"]
channels = ["conda-forge"]
# This fork ships on Apple Silicon. Linux/Windows/Intel Mac are not build targets.
# Shared C++ (Part, CAM, BIM, FEM, …) stays; pixi just does not fetch those OS packages.
platforms = [ "osx-arm64" ]
requires-pixi = ">=0.48"

[dependencies]
av = "*"
blinker = "*"
calculix = "*"
ccache = "*"
cmake = "*"
compilers = ">=1.10,<1.11"
conda-devenv = "*"
debugpy = "*"
defusedxml = "*"
docutils = "*"
doxygen = "*"
eigen = ">=3.3,<5"
expat = "*"
fmt = "*"
freetype = "*"
git = "*"
graphviz = "*"
gtest= "*"
harfbuzz = "*"
hdf5 = "*"
ifcopenshell = "*"
lark = "*"
libboost-devel = "*"
lxml = "*"
matplotlib = "*"
nine = "*"
ninja = "*"
noqt5 = "*"
numpy = ">=1.26,<1.27"
nlohmann_json = "*"
occt = ">=7.8,<7.9"
opencamlib = "*"
openssl = "*"
pandas = "*"
pcl = "*"
pip = "*"
ply = "*"
pre-commit = "*"
pyright = "==1.1.408"
pybind11 = "*"
pycollada = "*"
pyside6 = "*"
python = ">=3.11,<3.12"
pythonocc-core = "*"
pyyaml = "*"
qt6-main = ">=6.8,<6.9"
requests = "*"
scipy = "*"
six = "*"
smesh = "*"
swig = "*"
sympy = "*"
typing-extensions = "*"
tbb-devel = ">=2022,<2023"
vtk = "*"
xerces-c = "*"
xlutils = "*"
yaml-cpp = "*"
zlib = "*"
zstd = "*"
compiler-rt = ">=18.1.8,<22"

[target.osx-arm64.dependencies]
sed = "*"

[pypi-dependencies]
freecad-stubs = "*"

[target.osx-arm64.tasks]
configure-debug = { cmd = [ "cmake", "--preset", "conda-macos-debug", "{{ extra_args }}" ], args = [{ "arg" = "extra_args", "default" = "" }], depends-on = ["initialize"], env={ CFLAGS="", CXXFLAGS="", DEBUG_CFLAGS="", DEBUG_CXXFLAGS="" }}
configure-release = { cmd = [ "cmake", "--preset", "conda-macos-release" ], depends-on = ["initialize"], env={ CFLAGS="", CXXFLAGS="", DEBUG_CFLAGS="", DEBUG_CXXFLAGS="" }}
macos-app = { cmd = [ "Documents/macos-app.sh" ] }
macos-cleanup = { cmd = [ "Documents/macos-cleanup.sh" ] }

[tasks]
initialize = { cmd = ["git", "submodule", "update", "--init", "--recursive"]}
configure = [{ task = "configure-release" }]
build = [{ task = "build-release" }]
install = [{ task = "install-release" }]
test = [{ task = "test-release" }]
freecad = [{ task = "freecad-release" }]

build-debug = { cmd = ["cmake", "--build", "build/debug"]}
build-release = { cmd = ["cmake", "--build", "build/release"]}
install-debug = { cmd = ["cmake", "--install", "build/debug"]}
install-release = { cmd = ["cmake", "--install", "build/release"]}
test-debug = { cmd = ["ctest", "--test-dir", "build/debug"]}
test-release = { cmd = ["ctest", "--test-dir", "build/release"]}
freecad-debug = "build/debug/bin/FreeCAD"
freecad-release = "build/release/bin/FreeCAD"
