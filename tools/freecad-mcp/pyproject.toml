[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "freecad-mcp-agent"
version = "0.1.0"
description = "MCP debug agent for FreeCAD — bridges Claude with live FreeCAD runtime state"
requires-python = ">=3.10"
license = "LGPL-2.1-or-later"
dependencies = [
    "mcp[cli]>=1.2.0,<2",
]

[project.scripts]
freecad-mcp-agent = "freecad_mcp_agent.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/freecad_mcp_agent"]
